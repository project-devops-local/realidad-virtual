<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugos Naturales · Menú AR</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4fbf1; color: #1d2b1f; }
    main { max-width: 480px; margin: 0 auto; padding: 32px 16px; text-align: center; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    p { color: #4a5c4d; line-height: 1.5; }
    .btn {
      display: inline-block; margin: 20px 0; padding: 16px 28px; border-radius: 999px;
      background: #1b7a3d; color: #fff; text-decoration: none; font-weight: 600; font-size: 18px;
    }
    .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .card img { width: 100%; border-radius: 10px; }
    small { color: #7a8a7d; }
  </style>
</head>
<body>
  <main>
    <h1>🍹 Nuestro menú en 3D</h1>
    <p>Mira nuestros jugos en realidad aumentada, directamente sobre tu mesa.</p>
    <a class="btn" href="ar.html">Abrir cámara AR</a>

    <div class="card">
      <p><strong>¿Cómo funciona?</strong><br>Toca el botón, permite la cámara y apunta a la tarjeta del menú.</p>
      <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png"
           alt="Tarjeta de prueba para apuntar la cámara">
      <small>Tarjeta de prueba: imprímela o ábrela en otra pantalla.</small>
    </div>
  </main>
</body>
</html>
