<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Menú AR · Jugos Naturales</title>

  <!-- A-Frame (MIT) + MindAR (MIT): 100% open source, sin instalar nada -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="jugos.js"></script>

  <script>
    // Componente que arma el vaso 3D con los colores del producto indicado
    AFRAME.registerComponent('jugo-3d', {
      schema: { producto: { type: 'int', default: 0 } },
      init() {
        const j = JUGOS[this.data.producto];
        this.el.innerHTML = `
          <a-entity rotation="90 0 0" scale="0.8 0.8 0.8">
            <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 14000; easing: linear">
              <a-circle radius="0.32" rotation="-90 0 0" position="0 0.002 0"
                        material="color: #000; opacity: 0.25; transparent: true"></a-circle>

              <a-entity class="fill" position="0 0.03 0"
                        animation__fill="property: scale; from: 1 0.01 1; to: 1 1 1; dur: 900; easing: easeOutCubic; startEvents: refill">
                <a-cylinder radius="0.205" height="0.55" position="0 0.275 0" color="${j.liquido}"></a-cylinder>
                <a-cylinder radius="0.205" height="0.035" position="0 0.567 0" color="${j.espuma}"></a-cylinder>
              </a-entity>

              <a-box width="0.1" height="0.1" depth="0.1" position="-0.07 0.52 0.05" rotation="20 30 10"
                     material="color: #fff; opacity: 0.55; transparent: true"></a-box>
              <a-box width="0.09" height="0.09" depth="0.09" position="0.06 0.54 -0.06" rotation="-15 45 0"
                     material="color: #fff; opacity: 0.55; transparent: true"></a-box>

              <a-cylinder radius="0.22" height="0.72" position="0 0.36 0" open-ended="true"
                          material="color: #fff; opacity: 0.22; transparent: true; side: double; roughness: 0.05"></a-cylinder>
              <a-cylinder radius="0.22" height="0.03" position="0 0.015 0"
                          material="color: #fff; opacity: 0.35; transparent: true"></a-cylinder>

              <a-cylinder radius="0.018" height="0.95" position="0.07 0.62 0" rotation="0 0 -12" color="#e63946"></a-cylinder>

              <a-entity position="0.22 0.7 0" rotation="90 0 0">
                <a-cylinder radius="0.14" height="0.02" color="${j.cascara}"></a-cylinder>
                <a-cylinder radius="0.125" height="0.03" color="${j.pulpa}"></a-cylinder>
              </a-entity>

              <a-sphere radius="0.1" color="${j.fruta}"
                        animation="property: position; from: -0.42 0.25 0; to: -0.42 0.4 0; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine"></a-sphere>
            </a-entity>
          </a-entity>`;
      }
    });
  </script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 8px 14px; border-radius: 999px;
      background: rgba(0,0,0,.6); color: #fff; font-size: 13px; white-space: nowrap;
    }

    /* Recuadro de info pequeño */
    #info {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 10; width: max-content; max-width: 240px;
      padding: 8px 12px; border-radius: 12px;
      background: rgba(255,255,255,.92); box-shadow: 0 4px 14px rgba(0,0,0,.25);
      text-align: center; transition: opacity .25s;
    }
    #info.hidden { opacity: 0; pointer-events: none; }
    #info b { display: block; font-size: 15px; }
    #info small { display: block; font-size: 11px; color: #555; margin: 2px 0; }
    #info span { font-size: 14px; font-weight: 700; color: #1b7a3d; }
  </style>
</head>
<body>
  <div id="hint">📷 Apunta a un producto de la carta</div>
  <div id="info" class="hidden"><b id="name"></b><small id="desc"></small><span id="price"></span></div>

  <!-- targets.mind contiene las 4 imágenes de img/ (se genera con generar.html) -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiScanning: no; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="1 2 3" intensity="0.9"></a-light>

    <!-- Un objetivo por producto: targetIndex = posición de la imagen en targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0"><a-entity jugo-3d="producto: 0"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"><a-entity jugo-3d="producto: 1"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"><a-entity jugo-3d="producto: 2"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"><a-entity jugo-3d="producto: 3"></a-entity></a-entity>
  </a-scene>

  <script>
    const $ = (id) => document.getElementById(id);

    document.querySelectorAll('[mindar-image-target]').forEach((target) => {
      const i = target.getAttribute('mindar-image-target').targetIndex;

      target.addEventListener('targetFound', () => {
        const j = JUGOS[i];
        $('name').textContent = j.nombre;
        $('desc').textContent = j.desc;
        $('price').textContent = j.precio;
        $('info').classList.remove('hidden');
        $('hint').style.display = 'none';
        target.querySelector('.fill').emit('refill');
      });

      target.addEventListener('targetLost', () => {
        $('info').classList.add('hidden');
        $('hint').style.display = '';
      });
    });
  </script>
</body>
</html>
