<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta · Jugos Naturales</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #1d2b1f; color: #fff; }
    main { text-align: center; padding: 16px; width: 100%; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: #cfe3d2; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(100%, 380px); margin: 0 auto; }
    .grid img { width: 100%; display: block; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>🍹 Carta de jugos</h1>
    <p>Apunta la cámara AR a cualquier cuadro</p>
    <div class="grid">
      <img src="img/producto-1.png" alt="Naranja Zanahoria">
      <img src="img/producto-2.png" alt="Fresa Banano">
      <img src="img/producto-3.png" alt="Verde Detox">
      <img src="img/producto-4.png" alt="Mango Maracuyá">
    </div>
  </main>
</body>
</html>
